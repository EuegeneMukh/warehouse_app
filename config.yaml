name: Warehouse
version: "1.0.1"
slug: warehouse
description: Local component warehouse with SQLite and automatic backups
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:warehouse
map:
  - share:rw
options:
  backup_interval_hours: 24
  backup_retention: 30
schema:
  backup_interval_hours: int
  backup_retention: int
